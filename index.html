<!doctype html>
<html lang="pt-BR" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MegaStream — Sua diversão em um só lugar!</title>
    <meta name="description" content="MegaStream — Plataforma profissional de streaming de filmes, séries e canais ao vivo com catálogo TMDB, player MegaEmbed e Inteligência Artificial." />
    <meta property="og:title" content="MegaStream — Sua diversão em um só lugar!" />
    <meta property="og:description" content="Filmes, séries, canais ao vivo e recomendações inteligentes com IA em uma experiência cinematográfica." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400..700&family=JetBrains+Mono:wght@400;600&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />
    <script src="https://www.gstatic.com/cv/js/sender/v1/cast_sender.js?loadCastFramework=1"></script>
    <script>
      window.__onGCastApiAvailable = function (isAvailable) {
        if (isAvailable && window.cast && window.cast.framework && window.chrome && window.chrome.cast) {
          try {
            window.cast.framework.CastContext.getInstance().setOptions({
              receiverApplicationId: window.chrome.cast.media.DEFAULT_MEDIA_RECEIVER_APP_ID,
              autoJoinPolicy: window.chrome.cast.AutoJoinPolicy.ORIGIN_SCOPED
            });
            window.dispatchEvent(new CustomEvent('google-cast-api-ready'));
          } catch (e) {
            console.warn('Google Cast init:', e);
          }
        }
      };
    </script>
  </head>
  <body class="bg-[#050814] text-slate-100 antialiased selection:bg-blue-500/30 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
